name: Release

# Publishes @drupalmcp/adk when a tag like adk-v0.1.0 is pushed.
# Uses npm trusted publishing (OIDC), so no token is stored anywhere.
# Configure it once at npmjs.com → the package → Settings → Trusted publisher,
# naming this repository and this workflow file.

on:
  push:
    tags: ['adk-v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm publish --workspace @drupalmcp/adk
